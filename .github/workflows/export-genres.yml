name: Export ecstatic tracks genres

# One-off export - writes ecstatic_tracks_genres.csv listing every track in
# "ecstatic tracks" with its artist(s) and genres, and commits it to the repo.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Export genres CSV
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python export_genres_csv.py

      - name: Commit CSV
        run: |
          git config user.name "playlist-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ecstatic_tracks_genres.csv
          git diff --staged --quiet || git commit -m "Export ecstatic tracks genres CSV"
          git push

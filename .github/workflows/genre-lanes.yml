name: Genre lanes (weekly)

on:
  schedule:
    # Mondays 15:00 UTC, an hour after the outside-the-loop job
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would be added, change nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: genre-lanes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find new artists per genre lane
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          # Optional: add a LASTFM_API_KEY repo secret to use Last.fm instead of ListenBrainz
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python genre_lanes.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "playlist-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lanes_state.json
          git diff --staged --quiet || git commit -m "Update genre-lanes state [skip ci]"
          git pull --rebase
          git push

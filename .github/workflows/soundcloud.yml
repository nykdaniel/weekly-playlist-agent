name: SoundCloud daily digest

on:
  schedule:
    # 13:15 UTC every day, just after the Spotify job
    - cron: "15 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SoundCloud digest
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ vars.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_OAUTH_TOKEN: ${{ secrets.SOUNDCLOUD_OAUTH_TOKEN }}
        run: python soundcloud_agent.py

      - name: Save state
        run: |
          git config user.name "playlist-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add soundcloud_state.json
          git diff --staged --quiet || git commit -m "Update SoundCloud state [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

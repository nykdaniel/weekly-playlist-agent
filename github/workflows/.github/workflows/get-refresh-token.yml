name: One-Time - Get Spotify Refresh Token

# This workflow is only run ONCE, manually, to set up the agent for the first time.
# You'll paste in a short-lived code you get from logging into Spotify, and this
# will print a long-lived "refresh token" that you then save as a secret.

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "The 'code' value from the Spotify redirect URL"
        required: true

jobs:
  exchange-code:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange authorization code for a refresh token
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: |
          curl -s -X POST https://accounts.spotify.com/api/token \
            -u "$SPOTIFY_CLIENT_ID:$SPOTIFY_CLIENT_SECRET" \
            -d grant_type=authorization_code \
            -d code="$AUTH_CODE" \
            -d redirect_uri=http://127.0.0.1:8888/callback \
          | python3 -m json.tool

name: Weekly Playlist Update

on:
  schedule:
    # Runs every Monday at 09:00 UTC. Edit the numbers to change day/time.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the agent
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python main.py

      - name: Save updated memory of seen tracks
        run: |
          git config user.name "Playlist Agent"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update seen-tracks memory"
          git push
